  <!-- SEEMEE Loader Styles -->
  <style>
    :root {
      --sm-bg: #fbf4ea;
      --sm-wine: #8e2744;
      --sm-gold: #b98a45;
      --sm-ink: #4a3a35;
      --sm-blush: #efc3be;
    }

    #sm-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: var(--sm-bg);
      background-image: url('/seemee-boutique-bg.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      user-select: none;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--sm-ink);
    }

    #sm-loader.sm-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .sm-beam {
      position: absolute;
      inset: -20%;
      background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255, 255, 255, 0.25) 90px 150px);
      animation: smBeam 14s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes smBeam {
      from { transform: translateX(-3%); }
      to { transform: translateX(3%); }
    }

    .sm-petal {
      position: absolute;
      top: -6%;
      width: 12px;
      height: 16px;
      border-radius: 70% 0 70% 0;
      background: var(--sm-blush);
      opacity: 0;
      animation: smFall linear infinite;
      pointer-events: none;
    }
    @keyframes smFall {
      0% { transform: translate3d(0, 0, 0) rotate(0); opacity: 0; }
      10% { opacity: 0.85; }
      100% { transform: translate3d(60px, 110vh, 0) rotate(540deg); opacity: 0; }
    }

    .sm-center {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 16px;
    }

    .sm-lotus {
      width: clamp(80px, 12vw, 100px);
      overflow: visible;
    }
    .sm-lotus path {
      fill: none;
      stroke: var(--sm-gold);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: smDraw 2.4s ease-out forwards;
    }
    .sm-lotus path:nth-child(2) { animation-delay: 0.3s; }
    .sm-lotus path:nth-child(3) { animation-delay: 0.6s; }
    .sm-lotus path:nth-child(4) { animation-delay: 0.9s; }
    .sm-lotus .sm-dot {
      fill: var(--sm-gold);
      stroke: none;
      opacity: 0;
      animation: smFade 0.6s 2s forwards;
    }
    @keyframes smDraw { to { stroke-dashoffset: 0; } }
    @keyframes smFade { to { opacity: 1; } }

    .sm-brand {
      margin: 10px 0 0;
      font-weight: 700;
      font-size: clamp(52px, 11vw, 112px);
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--sm-wine);
      display: flex;
    }
    .sm-brand span {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      filter: blur(6px);
      animation: smLetter 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    .sm-brand span:nth-child(1) { animation-delay: 0.9s; }
    .sm-brand span:nth-child(2) { animation-delay: 1.0s; }
    .sm-brand span:nth-child(3) { animation-delay: 1.1s; }
    .sm-brand span:nth-child(4) { animation-delay: 1.2s; }
    .sm-brand span:nth-child(5) { animation-delay: 1.3s; }
    .sm-brand span:nth-child(6) { animation-delay: 1.4s; }
    @keyframes smLetter { to { opacity: 1; transform: none; filter: none; } }

    .sm-rule {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 10px;
      width: min(300px, 60vw);
    }
    .sm-rule i {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sm-gold));
      transform: scaleX(0);
      animation: smGrow 1s 1.8s forwards;
    }
    .sm-rule i:last-child {
      background: linear-gradient(270deg, transparent, var(--sm-gold));
    }
    .sm-rule b {
      width: 7px;
      height: 7px;
      background: var(--sm-gold);
      transform: rotate(45deg) scale(0);
      animation: smPop 0.6s 1.8s forwards;
    }
    @keyframes smGrow { to { transform: scaleX(1); } }
    @keyframes smPop { to { transform: rotate(45deg) scale(1); } }

    .sm-tag {
      margin: 0;
      font-weight: 600;
      font-size: clamp(11px, 1.6vw, 15px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--sm-ink);
      opacity: 0;
      animation: smFade 1s 2.1s forwards;
    }

    .sm-spinner {
      margin-top: clamp(24px, 5vh, 48px);
      width: clamp(64px, 8vw, 80px);
      height: auto;
      opacity: 0;
      animation: smFade 0.8s 2.4s forwards;
    }
    .sm-spinner .track {
      fill: none;
      stroke: var(--sm-gold);
      stroke-width: 2.5;
      opacity: 0.28;
    }
    .sm-spinner .arc {
      fill: none;
      stroke: url(#gSmIdx);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 70 190;
      transform-origin: 50% 50%;
      animation: smSpin 1.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .sm-spinner .head {
      fill: var(--sm-wine);
      transform-origin: 50% 50%;
      animation: smSpin 1.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    @keyframes smSpin { to { transform: rotate(360deg); } }

    .sm-load {
      margin: 14px 0 0;
      font-size: 20px;
      letter-spacing: 0.04em;
      color: var(--sm-ink);
      opacity: 0;
      animation: smFade 0.8s 2.6s forwards;
    }
    .sm-load em {
      font-style: normal;
      display: inline-block;
      animation: smDot 1.4s infinite;
    }
    .sm-load em:nth-of-type(2) { animation-delay: 0.2s; }
    .sm-load em:nth-of-type(3) { animation-delay: 0.4s; }
    @keyframes smDot { 0%, 60%, 100% { opacity: 0.2; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01s !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
      .sm-petal, .sm-beam { display: none; }
    }
  </style>

  <!-- SEEMEE Loading Screen -->
  <div id="sm-loader" role="status" aria-live="polite" aria-label="SEEMEE is loading">
    <div class="sm-beam"></div>

    <div class="sm-center">
      <!-- 1. Gold Outline Lotus SVG Logo -->
      <svg class="sm-lotus" viewBox="0 0 120 100" aria-hidden="true">
        <path pathLength="1" d="M60 8L63 14L60 20L57 14Z"/>
        <path pathLength="1" d="M60 28C46 40 46 58 60 74C74 58 74 40 60 28Z"/>
        <path pathLength="1" d="M60 74C44 66 38 52 40 40C28 46 22 56 24 64C30 76 46 82 60 80"/>
        <path pathLength="1" d="M60 74C76 66 82 52 80 40C92 46 98 56 96 64C90 76 74 82 60 80"/>
        <circle class="sm-dot" cx="60" cy="52" r="2"/>
      </svg>

      <!-- 2. Brand Title with Letter-by-Letter Blur-up Reveal -->
      <h1 class="sm-brand" aria-label="SEEMEE">
        <span>S</span><span>E</span><span>E</span><span>M</span><span>E</span><span>E</span>
      </h1>

      <!-- 3. Hairline Divider & Diamond Accent -->
      <div class="sm-rule"><i></i><b></b><i></i></div>

      <!-- 4. Tagline -->
      <p class="sm-tag">Ethnic wear for every you</p>

      <!-- 5. Gold & Wine Circular Gradient Spinner -->
      <svg class="sm-spinner" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="gSmIdx" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b98a45"/>
            <stop offset="1" stop-color="#8e2744"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="50" cy="50" r="42"/>
        <circle class="arc" cx="50" cy="50" r="42"/>
        <g class="head"><circle cx="50" cy="8" r="5"/></g>
      </svg>

      <!-- 6. Loading Text with Staggered Bouncing Dots -->
      <p class="sm-load">Loading<em>.</em><em>.</em><em>.</em></p>
    </div>
  </div>

  <script>
    (function () {
      var L = document.getElementById('sm-loader');
      if (!L) return;

      // Dynamic Petals
      for (var i = 0; i < 10; i++) {
        var p = document.createElement('div');
        p.className = 'sm-petal';
        p.style.left = (Math.random() * 100) + '%';
        p.style.animationDuration = (9 + Math.random() * 8) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.transform = 'scale(' + (0.6 + Math.random() * 0.9) + ')';
        L.appendChild(p);
      }

      function exit() {
        L.classList.add('sm-hide');
        setTimeout(function () {
          if (L.parentNode) L.parentNode.removeChild(L);
        }, 550);
      }

      // Allow complete animation sequence (4.5 seconds) to play before fading out
      var startTime = performance.now();
      var MIN_DISPLAY_TIME = 4500;

      function scheduleExit() {
        var elapsed = performance.now() - startTime;
        var remaining = Math.max(0, MIN_DISPLAY_TIME - elapsed);
        setTimeout(exit, remaining);
      }

      if (document.readyState === 'complete') {
        scheduleExit();
      } else {
        window.addEventListener('load', scheduleExit, { once: true });
        setTimeout(scheduleExit, MIN_DISPLAY_TIME);
      }
    })();
  </script>
