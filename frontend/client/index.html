<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="See Mee - Discover premium ethnic wear including Anarkali suits, Palazzo suits, Straight Cut suits, and Sharara suits. Handcrafted with elegance, designed for grace." />

  <!-- Security Meta Tags (Note: CSP and X-Frame-Options work via HTTP headers in vercel.json) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

  <title>See Mee - Premium Ethnic Wear & Women's Suits</title>

  <!-- DNS Prefetch for faster font loading -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

  <!-- Preload critical fonts (Playfair Display and Poppins with full weight ranges) -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300..900;1,300..900&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'">

  <!-- Fallback for browsers without JavaScript -->
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet">
  </noscript>

  <!-- Inline critical CSS for font fallback -->
  <style>
    /* System font fallback to prevent FOUT (Flash of Unstyled Text) */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Prevent layout shift while fonts load */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: Georgia, 'Times New Roman', serif;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
