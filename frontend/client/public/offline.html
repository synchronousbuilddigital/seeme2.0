<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - See Mee Ethnic Wear</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAF9F6;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      max-width: 400px;
      padding: 32px 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin: 16px;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px 0;
      color: #991b1b;
      font-family: serif;
    }
    p {
      font-size: 0.9rem;
      color: #6b7280;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    button {
      background: #991b1b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover {
      background: #7f1d1d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✨</div>
    <h1>See Mee Haute Couture</h1>
    <p>You are currently offline. Please reconnect to internet to browse our latest ethnic collections and place orders.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
