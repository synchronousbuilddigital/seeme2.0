<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEEMEE – Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf4ea;
  --bg2: #f4e6d6;
  --wine: #8e2744;
  --gold: #b98a45;
  --ink: #4a3a35;
  --blush: #efc3be;
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  background-color: var(--bg);
  background-image: url('seemee-boutique-bg.jpg');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  overflow: hidden;
  font-family: var(--serif);
  color: var(--ink);
}

/* Fullscreen flex stage */
.stage {
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Ambient drifting sunlight overlay */
.beam {
  position: absolute;
  inset: -20%;
  background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255, 255, 255, 0.25) 90px 150px);
  animation: beam 14s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes beam {
  from { transform: translateX(-3%); }
  to { transform: translateX(3%); }
}

/* Falling blush petals */
.petal {
  position: absolute;
  top: -6%;
  width: 12px;
  height: 16px;
  border-radius: 70% 0 70% 0;
  background: var(--blush);
  opacity: 0;
  animation: fall linear infinite;
  pointer-events: none;
}

@keyframes fall {
  0% { transform: translate3d(0, 0, 0) rotate(0); opacity: 0; }
  10% { opacity: 0.85; }
  100% { transform: translate3d(60px, 110vh, 0) rotate(540deg); opacity: 0; }
}

/* Center Column */
.center {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 16px;
}

/* 1. Self-drawing Gold Lotus SVG */
.lotus {
  width: clamp(80px, 12vw, 100px);
  overflow: visible;
}

.lotus path {
  fill: none;
  stroke: var(--gold);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: draw 2.4s ease-out forwards;
}

.lotus path:nth-child(2) { animation-delay: 0.3s; }
.lotus path:nth-child(3) { animation-delay: 0.6s; }
.lotus path:nth-child(4) { animation-delay: 0.9s; }

.lotus .dot {
  fill: var(--gold);
  stroke: none;
  opacity: 0;
  animation: fade 0.6s 2s forwards;
}

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

@keyframes fade {
  to { opacity: 1; }
}

/* 2. Brand Title with staggered letter un-blur */
.brand {
  margin: 10px 0 0;
  font-weight: 700;
  font-size: clamp(52px, 11vw, 112px);
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--wine);
  display: flex;
}

.brand span {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  filter: blur(6px);
  animation: letter 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}

.brand span:nth-child(1) { animation-delay: 0.9s; }
.brand span:nth-child(2) { animation-delay: 1.0s; }
.brand span:nth-child(3) { animation-delay: 1.1s; }
.brand span:nth-child(4) { animation-delay: 1.2s; }
.brand span:nth-child(5) { animation-delay: 1.3s; }
.brand span:nth-child(6) { animation-delay: 1.4s; }

@keyframes letter {
  to {
    opacity: 1;
    transform: none;
    filter: none;
  }
}

/* 3. Gold Hairline Divider & Rotated Diamond */
.rule {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0 10px;
  width: min(300px, 60vw);
}

.rule i {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold));
  transform: scaleX(0);
  animation: grow 1s 1.8s forwards;
}

.rule i:last-child {
  background: linear-gradient(270deg, transparent, var(--gold));
}

.rule b {
  width: 7px;
  height: 7px;
  background: var(--gold);
  transform: rotate(45deg) scale(0);
  animation: pop 0.6s 1.8s forwards;
}

@keyframes grow {
  to { transform: scaleX(1); }
}

@keyframes pop {
  to { transform: rotate(45deg) scale(1); }
}

/* 4. Tagline */
.tag {
  margin: 0;
  font-weight: 600;
  font-size: clamp(11px, 1.6vw, 15px);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink);
  opacity: 0;
  animation: fade 1s 2.1s forwards;
}

/* 5. Circular Metallic Gradient Spinner */
.spinner {
  margin-top: clamp(24px, 5vh, 48px);
  width: clamp(64px, 8vw, 80px);
  height: auto;
  opacity: 0;
  animation: fade 0.8s 2.4s forwards;
}

.spinner .track {
  fill: none;
  stroke: var(--gold);
  stroke-width: 2.5;
  opacity: 0.28;
}

.spinner .arc {
  fill: none;
  stroke: url(#g);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 70 190;
  transform-origin: 50% 50%;
  animation: spin 1.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
}

.spinner .head {
  fill: var(--wine);
  transform-origin: 50% 50%;
  animation: spin 1.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 6. Bouncing Dots Loading Text */
.load {
  margin: 14px 0 0;
  font-size: 20px;
  letter-spacing: 0.04em;
  color: var(--ink);
  opacity: 0;
  animation: fade 0.8s 2.6s forwards;
}

.load em {
  font-style: normal;
  display: inline-block;
  animation: dot 1.4s infinite;
}

.load em:nth-of-type(2) { animation-delay: 0.2s; }
.load em:nth-of-type(3) { animation-delay: 0.4s; }

@keyframes dot {
  0%, 60%, 100% { opacity: 0.2; transform: none; }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* Reduced Motion Overrides */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01s !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
  }
  .petal, .beam {
    display: none;
  }
}
</style>
</head>
<body>
<div class="stage" role="status" aria-live="polite" aria-label="SEEMEE is loading">
  <!-- Drifting light overlay -->
  <div class="beam"></div>

  <!-- Centered Content -->
  <div class="center">
    <!-- 1. Gold Outline Lotus SVG Logo -->
    <svg class="lotus" viewBox="0 0 120 100" aria-hidden="true">
      <path pathLength="1" d="M60 8L63 14L60 20L57 14Z"/>
      <path pathLength="1" d="M60 28C46 40 46 58 60 74C74 58 74 40 60 28Z"/>
      <path pathLength="1" d="M60 74C44 66 38 52 40 40C28 46 22 56 24 64C30 76 46 82 60 80"/>
      <path pathLength="1" d="M60 74C76 66 82 52 80 40C92 46 98 56 96 64C90 76 74 82 60 80"/>
      <circle class="dot" cx="60" cy="52" r="2"/>
    </svg>

    <!-- 2. Brand Name with Letter-by-Letter Blur-up Reveal -->
    <h1 class="brand" aria-label="SEEMEE">
      <span>S</span><span>E</span><span>E</span><span>M</span><span>E</span><span>E</span>
    </h1>

    <!-- 3. Hairline Divider & Diamond Accent -->
    <div class="rule"><i></i><b></b><i></i></div>

    <!-- 4. Tagline -->
    <p class="tag">Ethnic wear for every you</p>

    <!-- 5. Gold & Wine Circular Gradient Spinner -->
    <svg class="spinner" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#b98a45"/>
          <stop offset="1" stop-color="#8e2744"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="50" cy="50" r="42"/>
      <circle class="arc" cx="50" cy="50" r="42"/>
      <g class="head"><circle cx="50" cy="8" r="5"/></g>
    </svg>

    <!-- 6. Loading Text with Staggered Bouncing Dots -->
    <p class="load">Loading<em>.</em><em>.</em><em>.</em></p>
  </div>
</div>

<script>
// Drifting petals generated dynamically
(function() {
  var stage = document.querySelector('.stage');
  if (!stage) return;
  for (var i = 0; i < 10; i++) {
    var p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + '%';
    p.style.animationDuration = (9 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.transform = 'scale(' + (0.6 + Math.random() * 0.9) + ')';
    stage.appendChild(p);
  }
})();
</script>
</body>
</html>
